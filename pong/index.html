<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Понг · Web Games</title>
  <meta name="description" content="Понг против ИИ: мышь, тач или стрелки. Мяч ускоряется с каждым отбитием, партия до семи очков." />
  <link rel="canonical" href="https://folombas.github.io/web-games/pong/" />
  <meta property="og:title" content="Понг · Web Games" />
  <meta property="og:description" content="Понг против ИИ: мышь, тач или стрелки. Мяч ускоряется с каждым отбитием, партия до семи очков." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://folombas.github.io/web-games/pong/" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎮</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <main class="app" id="main">
    <header class="app__header">
      <a class="back-link" href="../">← В лобби</a>
      <span class="app__badge">web-games · игра №9</span>
      <h1 class="app__title">Понг</h1>
      <p class="app__subtitle">Ты слева, ИИ справа. Партия до 7 очков; мяч ускоряется с каждым отбитием</p>
    </header>

    <section class="scoreboard" aria-label="Счёт">
      <div class="score-card score-card--accent"><span class="score-card__label">Ты</span><span class="score-card__value" id="scoreLeft">0</span></div>
      <div class="score-card"><span class="score-card__label">ИИ</span><span class="score-card__value" id="scoreRight">0</span></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Подача: нажми на поле или пробел</p>

    <div class="stage">
      <canvas id="court" width="480" height="320" aria-label="Игровое поле понга"></canvas>
      <div class="over hidden" id="over">
        <p class="over__title" id="overTitle">Победа!</p>
        <button type="button" class="btn btn--primary" id="again">🔁 Ещё партия</button>
      </div>
    </div>

    <footer class="app__footer">
      <p>Коллекция <a href="../">web-games</a> · <a href="https://github.com/Folombas/web-games">GitHub</a> · сестринский проект <a href="https://github.com/Folombas/FinFocus">FinFocus</a></p>
    </footer>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
