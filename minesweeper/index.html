<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сапёр · Web Games</title>
  <meta name="description" content="Сапёр без нервов: первый клик всегда безопасен, флажки правой кнопкой или долгим тапом, таймер и счётчик мин. Два размера поля." />
  <link rel="canonical" href="https://folombas.github.io/web-games/minesweeper/" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎮</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="main">
    <header class="app__header">
      <a class="back-link" href="../">← В лобби</a>
      <span class="app__badge">web-games · игра №6</span>
      <h1 class="app__title">Сапёр</h1>
      <p class="app__subtitle">Открывай клетки, обходя мины. Первый клик всегда безопасен: ЛКМ — открыть, ПКМ или долгий тап — флажок</p>
    </header>

    <section class="panel controls" aria-label="Настройки">
      <label class="difficulty">
        <span>Поле</span>
        <select id="difficulty">
          <option value="small" selected>9×9 · 10 мин</option>
          <option value="big">10×10 · 20 мин</option>
        </select>
      </label>
    </section>

    <section class="scoreboard" aria-label="Статус партии">
      <div class="score-card"><span class="score-card__label">Мины</span><span class="score-card__value" id="minesLeft">10</span></div>
      <div class="score-card"><span class="score-card__label">Время</span><span class="score-card__value" id="timer">0</span></div>
      <div class="score-card score-card--accent"><span class="score-card__label">Рекорд</span><span class="score-card__value" id="best">—</span></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Открой первую клетку</p>

    <div class="board-wrap">
      <div id="board" role="grid" aria-label="Поле сапёра"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="newGame">🔄 Новая игра</button>
      <button type="button" class="btn" id="flagMode" aria-pressed="false">🚩 Режим флажка</button>
    </div>

    <footer class="app__footer">
      <p>Коллекция <a href="../">web-games</a> · <a href="https://github.com/Folombas/web-games">GitHub</a> · сестринский проект <a href="https://github.com/Folombas/FinFocus">FinFocus</a></p>
    </footer>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
