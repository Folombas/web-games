<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Память · Web Games</title>
  <meta name="description" content="Игра «Память»: открывай карточки и находи пары на время. 16 карт, счётчик ходов, рекорд сохраняется." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎮</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <main class="app" id="main">
    <header class="app__header">
      <a class="back-link" href="../">← В лобби</a>
      <span class="app__badge">web-games · игра №8</span>
      <h1 class="app__title">Память</h1>
      <p class="app__subtitle">Открывай две карты за ход и находи все восемь пар</p>
    </header>

    <section class="scoreboard" aria-label="Статус партии">
      <div class="score-card"><span class="score-card__label">Время</span><span class="score-card__value" id="time">0</span></div>
      <div class="score-card"><span class="score-card__label">Ходов</span><span class="score-card__value" id="moves">0</span></div>
      <div class="score-card score-card--accent"><span class="score-card__label">Лучшее время</span><span class="score-card__value" id="best">—</span></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Открой любую карту</p>

    <div class="grid" id="grid" role="group" aria-label="Поле памяти 4 на 4"></div>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="newGame">🔄 Новая партия</button>
    </div>

    <footer class="app__footer">
      <p>Коллекция <a href="../">web-games</a> · <a href="https://github.com/Folombas/web-games">GitHub</a> · сестринский проект <a href="https://github.com/Folombas/FinFocus">FinFocus</a></p>
    </footer>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
